name: CI

# 单测 / 类型检查 / 覆盖率统计 / 兼容性矩阵。
#   - push 到 main 与每个 PR：跑全量单测与覆盖率，并执行覆盖率阈值门禁
#     （NFR-009：语句覆盖率 ≥85%）。
#   - push 到 main / 每周定时 / 手动触发：额外跑兼容性矩阵（离线 fixture，
#     见 testkit）。live 冒烟暂时跳过：compat 只跑离线矩阵，恢复时去掉命令
#     中的 --offline-only 即可。
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 每周一 02:00 UTC，防止上游协议变化长期不被发现
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      anthropic_model:
        description: 覆盖 ANTHROPIC_TEST_MODEL（可选，留空用默认）
        required: false
        type: string
      openai_model:
        description: 覆盖 OPENAI_TEST_MODEL（可选，留空用默认）
        required: false
        type: string
      compat_a_model:
        description: 覆盖 COMPAT_A_MODEL（可选，留空用 vars.COMPAT_A_MODEL）
        required: false
        type: string

permissions:
  contents: read

# 同一 ref 只保留最新一次运行（PR 多次 push 时取消旧 run）。schedule 与 push
# 到 main 的 github.ref 都是 refs/heads/main，同组互斥，避免重复跑兼容性矩阵。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Measure coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage-summary.json
          if-no-files-found: error

  # 兼容性矩阵：离线 fixture。只在 push 到 main / 定时 / 手动触发时跑（PR 不
  # 跑）；依赖 test job 通过。live 冒烟暂时跳过（只跑离线），恢复时去掉命令中
  # 的 --offline-only 即可。
  compat-live:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # API keys 全部来自 GitHub secret，各 provider 独立、均可选。
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMPAT_A_API_KEY: ${{ secrets.COMPAT_A_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # base url / model 从 vars.* 或 workflow_dispatch inputs 读取，写回环境
      # 变量。仅在值非空时才导出：testkit 的 ${VAR:default} 只对「未定义」
      # 回落，空字符串会覆盖默认，所以不能导出空值。
      - name: Configure provider base URLs & models
        env:
          V_ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          V_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          V_COMPAT_A_BASE_URL: ${{ vars.COMPAT_A_BASE_URL }}
          V_ANTHROPIC_MODEL: ${{ inputs.anthropic_model || vars.ANTHROPIC_TEST_MODEL }}
          V_OPENAI_MODEL: ${{ inputs.openai_model || vars.OPENAI_TEST_MODEL }}
          V_COMPAT_A_MODEL: ${{ inputs.compat_a_model || vars.COMPAT_A_MODEL }}
        run: |
          set -euo pipefail
          # 空/未定义时不导出（testkit 的 ${VAR:default} 只对未定义回落，空串会
          # 覆盖默认）；${!name:-} 保证 set -u 下对未定义变量安全。
          export_var() {
            local name="$1" target="$2"
            if [ -n "${!name:-}" ]; then
              echo "${target}=${!name:-}" >> "$GITHUB_ENV"
            fi
          }
          export_var V_ANTHROPIC_BASE_URL ANTHROPIC_BASE_URL
          export_var V_OPENAI_BASE_URL OPENAI_BASE_URL
          export_var V_COMPAT_A_BASE_URL COMPAT_A_BASE_URL
          export_var V_ANTHROPIC_MODEL ANTHROPIC_TEST_MODEL
          export_var V_OPENAI_MODEL OPENAI_TEST_MODEL
          export_var V_COMPAT_A_MODEL COMPAT_A_MODEL

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + testkit + apps)
        run: npm run typecheck:all

      - name: Unit & integration tests
        run: npm test

      # 离线 fixture 矩阵。budget 用于熔断意外狂发请求。live 暂时跳过。
      - name: Compatibility matrix (offline)
        run: npm run compat -- --offline-only --budget 60 --reports-dir reports

      - name: Upload compat reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-reports
          path: reports/
          if-no-files-found: ignore


