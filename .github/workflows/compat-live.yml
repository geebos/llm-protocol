name: Compatibility live tests

# 补充单测 CI：在离线 fixture 矩阵（npm test / --offline-only）之外，额外对
# 真实上游跑 live 冒烟场景（10.6）。live 场景纪律：provider 无 key 时自动
# skip，绝不 fail。
#
# 配置方式（均为可选项，缺谁就跳过谁的 live 场景）：
#   API key        -> GitHub secret（secrets.*）
#   base url/model -> 仓库变量 vars.* 或手动触发的 inputs；导出为环境变量，
#                     未设置时回落到 testkit/providers.ts 内置默认
#
# 注意：compatible-a 需同时配置 COMPAT_A_API_KEY + COMPAT_A_BASE_URL +
# COMPAT_A_MODEL 三者才会真正跑 live（model/baseUrl 无内置默认）。
on:
  workflow_dispatch:
    inputs:
      anthropic_model:
        description: 覆盖 ANTHROPIC_TEST_MODEL（可选，留空用默认）
        required: false
        type: string
      openai_model:
        description: 覆盖 OPENAI_TEST_MODEL（可选，留空用默认）
        required: false
        type: string
      compat_a_model:
        description: 覆盖 COMPAT_A_MODEL（可选，留空用 vars.COMPAT_A_MODEL）
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    # 每周一 02:00 UTC，防止上游协议变化长期不被发现
    - cron: "0 2 * * 1"

# 避免 push 与 schedule 同时触发导致重复打真实 API（live 有成本）
concurrency:
  group: compat-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compat-live:
    runs-on: ubuntu-latest
    env:
      # API keys 全部来自 GitHub secret，各 provider 独立、均可选。
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COMPAT_A_API_KEY: ${{ secrets.COMPAT_A_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # base url / model 从 vars.* 或 workflow_dispatch inputs 读取，写回环境
      # 变量。仅在值非空时才导出：testkit 的 ${VAR:default} 只对「未定义」
      # 回落，空字符串会覆盖默认，所以不能导出空值。
      - name: Configure provider base URLs & models
        env:
          V_ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          V_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          V_COMPAT_A_BASE_URL: ${{ vars.COMPAT_A_BASE_URL }}
          V_ANTHROPIC_MODEL: ${{ inputs.anthropic_model || vars.ANTHROPIC_TEST_MODEL }}
          V_OPENAI_MODEL: ${{ inputs.openai_model || vars.OPENAI_TEST_MODEL }}
          V_COMPAT_A_MODEL: ${{ inputs.compat_a_model || vars.COMPAT_A_MODEL }}
        run: |
          set -euo pipefail
          # 空/未定义时不导出（testkit 的 ${VAR:default} 只对未定义回落，空串会
          # 覆盖默认）；${!name:-} 保证 set -u 下对未定义变量安全。
          export_var() {
            local name="$1" target="$2"
            if [ -n "${!name:-}" ]; then
              echo "${target}=${!name:-}" >> "$GITHUB_ENV"
            fi
          }
          export_var V_ANTHROPIC_BASE_URL ANTHROPIC_BASE_URL
          export_var V_OPENAI_BASE_URL OPENAI_BASE_URL
          export_var V_COMPAT_A_BASE_URL COMPAT_A_BASE_URL
          export_var V_ANTHROPIC_MODEL ANTHROPIC_TEST_MODEL
          export_var V_OPENAI_MODEL OPENAI_TEST_MODEL
          export_var V_COMPAT_A_MODEL COMPAT_A_MODEL

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + testkit + apps)
        run: npm run typecheck:all

      - name: Unit & integration tests
        run: npm test

      # 离线 fixture 矩阵 + 真实上游 live 冒烟。budget 用于熔断意外狂发请求。
      - name: Compatibility matrix (offline + live)
        run: npm run compat -- --budget 60 --reports-dir reports

      - name: Upload compat reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-reports
          path: reports/
          if-no-files-found: ignore
